# Cloud Build configuration for GDC (Google Distributed Cloud)
# Optimized for deployment to on-premises GDC clusters

steps:
  # Configure Docker authentication for Container Registry
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'auth'
      - 'configure-docker'
      - '--quiet'
    id: 'configure-docker'

  # Build all services (triggered by GitHub)
  - name: 'bash'
    id: 'Setup Services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Building All Services ==="
        echo "image-understanding" > /workspace/changed_services.txt
        echo "video-understanding" >> /workspace/changed_services.txt
        echo "Services to build:"
        cat /workspace/changed_services.txt
    waitFor: ['configure-docker']

  # Build image-understanding if it changed
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image Understanding'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -q "image-understanding" /workspace/changed_services.txt; then
          echo "=== Building image-understanding ==="
          docker build --no-cache -t ${_CONTAINER_REGISTRY}/${PROJECT_ID}/image-understanding:${BUILD_ID} ./image-understanding
          echo "✓ image-understanding built successfully with tag: ${BUILD_ID}"
        else
          echo "⏭️  Skipping image-understanding build"
        fi
    waitFor: ['Setup Services']

  # Build video-understanding if it changed
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Video Understanding'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -q "video-understanding" /workspace/changed_services.txt; then
          echo "=== Building video-understanding ==="
          docker build --no-cache -t ${_CONTAINER_REGISTRY}/${PROJECT_ID}/video-understanding:${BUILD_ID} ./video-understanding
          echo "✓ video-understanding built successfully with tag: ${BUILD_ID}"
        else
          echo "⏭️  Skipping video-understanding build"
        fi
    waitFor: ['Setup Services']

  # Enhanced security scan with failure on critical vulnerabilities
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Security Scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Security Vulnerability Scanning ==="
        SCAN_FAILED=false
        
        if [ -f /workspace/changed_services.txt ]; then
          for service in $$(cat /workspace/changed_services.txt); do
            echo "Scanning $$service for vulnerabilities..."
            
            # Run the scan and capture results  
            if gcloud artifacts docker images scan ${_CONTAINER_REGISTRY}/${PROJECT_ID}/$$service:${BUILD_ID} \
              --location=${_SCAN_LOCATION} --format=json > /workspace/$$service-scan-results.json; then
              
              # Check for critical vulnerabilities
              CRITICAL_COUNT=$$(cat /workspace/$$service-scan-results.json | jq -r '.vulnerabilityOccurrences[] | select(.vulnerability.severity == "CRITICAL") | .vulnerability.severity' | wc -l)
              HIGH_COUNT=$$(cat /workspace/$$service-scan-results.json | jq -r '.vulnerabilityOccurrences[] | select(.vulnerability.severity == "HIGH") | .vulnerability.severity' | wc -l)
              
              echo "$$service scan results: $$CRITICAL_COUNT critical, $$HIGH_COUNT high severity vulnerabilities"
              
              if [ "$$CRITICAL_COUNT" -gt 0 ]; then
                echo "❌ CRITICAL vulnerabilities found in $$service"
                SCAN_FAILED=true
              fi
            else
              echo "⚠️  Scan failed for $$service (may not be available yet)"
            fi
          done
        fi
        
        if [ "$$SCAN_FAILED" = true ]; then
          echo "❌ Build failed due to critical security vulnerabilities"
          exit 1
        fi
        
        echo "✅ Security scan passed"
    waitFor: ['Build Image Understanding', 'Build Video Understanding']

  # Push images to registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Images'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Pushing Images ==="
        if [ -f /workspace/changed_services.txt ]; then
          for service in $$(cat /workspace/changed_services.txt); do
            echo "Pushing $$service:${BUILD_ID}..."
            docker push ${_CONTAINER_REGISTRY}/${PROJECT_ID}/$$service:${BUILD_ID}
            echo "✓ $$service pushed successfully"
          done
        fi
    waitFor: ['Security Scan']

  # Get GDC cluster credentials via Connect Gateway
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'container'
      - 'hub'
      - 'memberships'
      - 'get-credentials'
      - '${_GDC_CLUSTER_NAME}'
      - '--project=${PROJECT_ID}'
    id: 'get-credentials'
    waitFor: ['Push Images']

  # Generate self-signed certificates for HTTPS access
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Create certificate for image-understanding
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /workspace/image-tls.key -out /workspace/image-tls.crt \
          -subj "/CN=${_IMAGE_HOSTNAME}" \
          -addext "subjectAltName = DNS:${_IMAGE_HOSTNAME}"
        kubectl create secret tls image-understanding-tls \
          --cert=/workspace/image-tls.crt \
          --key=/workspace/image-tls.key \
          --namespace=${_K8S_NAMESPACE} \
          --dry-run=client -o yaml | kubectl apply -f -
        
        # Create certificate for video-understanding  
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /workspace/video-tls.key -out /workspace/video-tls.crt \
          -subj "/CN=${_VIDEO_HOSTNAME}" \
          -addext "subjectAltName = DNS:${_VIDEO_HOSTNAME}"
        kubectl create secret tls video-understanding-tls \
          --cert=/workspace/video-tls.crt \
          --key=/workspace/video-tls.key \
          --namespace=${_K8S_NAMESPACE} \
          --dry-run=client -o yaml | kubectl apply -f -
        
        echo "✓ Created TLS certificates for both services"
    id: 'create-tls-secrets'
    waitFor: ['get-credentials']

  # Deploy configmap
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "--- DEPLOYING CONFIGMAP ---"
        sed -e "s/\$${K8S_NAMESPACE}/${_K8S_NAMESPACE}/g" \
            -e "s/\$${PROJECT_ID}/$PROJECT_ID/g" \
            -e "s/\$${CONTAINER_REGISTRY}/${_CONTAINER_REGISTRY}/g" \
            k8s/02-configmap.yaml > /workspace/configmap.yaml.out
        
        echo "--- SUBSTITUTED YAML ---"
        cat /workspace/configmap.yaml.out
        echo "--- END SUBSTITUTED YAML ---"
        
        kubectl apply -f /workspace/configmap.yaml.out
    id: 'deploy-configmap'
    waitFor: ['create-tls-secrets']

  # Deploy image-understanding
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "--- DEPLOYING IMAGE-UNDERSTANDING ---"
        sed -e "s/\$${PROJECT_ID}/$PROJECT_ID/g" \
            -e "s/\$${BUILD_ID}/$BUILD_ID/g" \
            -e "s/\$${K8S_NAMESPACE}/${_K8S_NAMESPACE}/g" \
            -e "s/\$${CONTAINER_REGISTRY}/${_CONTAINER_REGISTRY}/g" \
            k8s/03-image-understanding.yaml > /workspace/image-understanding.yaml.out
        
        echo "--- SUBSTITUTED YAML ---"
        cat /workspace/image-understanding.yaml.out
        echo "--- END SUBSTITUTED YAML ---"
        
        kubectl apply -f /workspace/image-understanding.yaml.out
    id: 'deploy-image-understanding'
    waitFor: ['deploy-configmap']

  # Deploy video-understanding
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "--- DEPLOYING VIDEO-UNDERSTANDING ---"
        sed -e "s/\$${PROJECT_ID}/$PROJECT_ID/g" \
            -e "s/\$${BUILD_ID}/$BUILD_ID/g" \
            -e "s/\$${K8S_NAMESPACE}/${_K8S_NAMESPACE}/g" \
            -e "s/\$${CONTAINER_REGISTRY}/${_CONTAINER_REGISTRY}/g" \
            k8s/04-video-understanding.yaml > /workspace/video-understanding.yaml.out
        
        echo "--- SUBSTITUTED YAML ---"
        cat /workspace/video-understanding.yaml.out
        echo "--- END SUBSTITUTED YAML ---"
        
        kubectl apply -f /workspace/video-understanding.yaml.out
    id: 'deploy-video-understanding'
    waitFor: ['deploy-configmap']

  # Wait for deployments to be ready
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for deployments to be ready..."
        
        # Wait for image-understanding deployment
        if kubectl rollout status deployment/image-understanding \
          --namespace=${_K8S_NAMESPACE} \
          --timeout=600s; then
          echo "✓ image-understanding deployed successfully"
        else
          echo "❌ image-understanding rollout failed"
          kubectl describe deployment/image-understanding --namespace=${_K8S_NAMESPACE}
          kubectl get pods -l app=image-understanding --namespace=${_K8S_NAMESPACE} -o wide
          kubectl logs -l app=image-understanding --namespace=${_K8S_NAMESPACE} --tail=50 || echo "No logs available"
          exit 1
        fi
        
        # Wait for video-understanding deployment
        if kubectl rollout status deployment/video-understanding \
          --namespace=${_K8S_NAMESPACE} \
          --timeout=600s; then
          echo "✓ video-understanding deployed successfully"
        else
          echo "❌ video-understanding rollout failed"
          kubectl describe deployment/video-understanding --namespace=${_K8S_NAMESPACE}
          kubectl get pods -l app=video-understanding --namespace=${_K8S_NAMESPACE} -o wide
          kubectl logs -l app=video-understanding --namespace=${_K8S_NAMESPACE} --tail=50 || echo "No logs available"
          exit 1
        fi
        
        echo "✅ All deployments completed successfully!"
    id: 'verify-deployment'
    waitFor: ['deploy-image-understanding', 'deploy-video-understanding']

# Store built images
# images:
#   - '${_CONTAINER_REGISTRY}/${PROJECT_ID}/image-understanding'
#   - '${_CONTAINER_REGISTRY}/${PROJECT_ID}/video-understanding'

# Enhanced substitution variables for flexibility
substitutions:
  # GDC Cluster Configuration
  _GDC_CLUSTER_NAME: 'gdc-cloudspaces-tokyo'
  _K8S_NAMESPACE: 'media-understanding'
  
  # Container Registry
  _CONTAINER_REGISTRY: 'gcr.io'  # or 'us-central1-docker.pkg.dev' for Artifact Registry
  
  # Build Configuration
  _SCAN_LOCATION: 'us'
  
  # Domain Configuration for separate services
  _IMAGE_HOSTNAME: 'image-understanding.internal'    # Domain for image service
  _VIDEO_HOSTNAME: 'video-understanding.internal'    # Domain for video service

# GDC build options
options:
  # IMPORTANT: You MUST configure a Cloud Build private pool with network
  # access to your GDC cluster and specify it here.
  # pool:
  #   name: 'projects/anthos-bare-metal-lab-1/locations/us-central1/workerPools/gdc-worker-pool'
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (increased for GDC connectivity)
timeout: '1800s'

# Service account needs RBAC permissions on GDC cluster
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/685813425367-compute@developer.gserviceaccount.com'
