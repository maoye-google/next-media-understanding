apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-understanding
  namespace: ${K8S_NAMESPACE}
  labels:
    app: video-understanding
    app.kubernetes.io/managed-by: cloud-build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-understanding
  template:
    metadata:
      labels:
        app: video-understanding
    spec:
      containers:
      - name: video-understanding
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/video-understanding:${BUILD_ID}
        ports:
        - containerPort: 8443
          name: https
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-credentials
              key: GEMINI_API_KEY
        - name: PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "8443"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        # Higher resources for video processing workloads
        resources:
          requests:
            cpu: 500m      # 0.5 CPU cores
            memory: 1Gi    # 1 GB RAM for video processing
          limits:
            cpu: 500m      # Same as requests for Autopilot
            memory: 1Gi    # Same as requests for Autopilot
        # Security context for non-root execution
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false  # Node.js needs write access for temp files
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: video-understanding-tls
---
apiVersion: v1
kind: Service
metadata:
  name: video-understanding-svc
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
  annotations:
    service.beta.kubernetes.io/gcp-load-balancer-ssl-cert: video-understanding-tls
spec:
  selector:
    app: video-understanding
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  type: LoadBalancer