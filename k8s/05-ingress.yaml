# GDC-compatible LoadBalancer services for external access
apiVersion: v1
kind: Service
metadata:
  name: image-understanding-lb
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
spec:
  type: LoadBalancer
  selector:
    app: image-understanding
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8080
    protocol: TCP
    name: https
---
apiVersion: v1
kind: Service
metadata:
  name: video-understanding-lb
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
spec:
  type: LoadBalancer
  selector:
    app: video-understanding
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8080
    protocol: TCP
    name: https
---
# Standard Ingress for HTTPS termination (requires NGINX ingress controller on GDC)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-understanding-ingress
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${_IMAGE_HOSTNAME}
    secretName: image-understanding-tls
  rules:
  - host: ${_IMAGE_HOSTNAME}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: image-understanding-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-understanding-ingress
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${_VIDEO_HOSTNAME}
    secretName: video-understanding-tls
  rules:
  - host: ${_VIDEO_HOSTNAME}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: video-understanding-svc
            port:
              number: 80