# Standard Ingress for HTTPS termination (requires NGINX ingress controller on GDC)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-understanding-ingress
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: cloud-build
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${_IMAGE_HOSTNAME}
    secretName: image-understanding-tls
  rules:
  - host: ${_IMAGE_HOSTNAME}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: image-understanding-svc
            port:
              number: 80
---
